<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mills on Mission</title>
  <style>
    :root { --bg: #ffffff; --text: #222222; --muted: #666666; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111111; --text: #eeeeee; --muted: #aaaaaa; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           background: var(--bg); color: var(--text); font-family: Verdana, sans-serif; text-align: center; padding: 1.5rem; }
    h1 { font-size: 1.8rem; margin: 0 0 .5rem; }
    p { color: var(--muted); margin: .25rem 0; }
  </style>
</head>
<body>
  <main>
    <h1>Mills on Mission</h1>
    <p>Thy kingdom come, Thy will be done in earth, as it is in heaven.</p>
    <p>Matthew 6:10</p>
    <p>Coming soon.</p>
  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Page not found | Mills On Mission</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&amp;family=Jost:wght@400;500&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --night-900: #0b0e14; --night-800: #121826; --navy-600: #1d2944; --navy-line: #2e3a5c;
      --brass-400: #d2ab64; --brass-line: #5a4a30; --on-brass: #14110c;
      --ivory-100: #f3ead8; --ivory-200: #ece3d0; --ivory-300: #ddd3bf;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; color: var(--ivory-200);
      background: radial-gradient(ellipse at 78% 18%, var(--navy-600) 0%, var(--night-800) 45%, var(--night-900) 100%) fixed;
      font: 18px/1.6 Jost, Helvetica, Arial, sans-serif;
      padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
    }
    main { min-height: 100%; max-width: 640px; margin: 0 auto; padding: 48px 24px; display: flex; flex-direction: column; justify-content: center; gap: 28px; }
    .mark { font: 600 24px/1 "Cormorant Garamond", Georgia, serif; color: var(--ivory-100); text-decoration: none; }
    h1 { margin: 0; font: 600 56px/1 "Cormorant Garamond", Georgia, serif; color: var(--ivory-100); }
    p { margin: 0; color: var(--ivory-300); max-width: 520px; }
    .actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 8px; }
    .btn { display: flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 20px; border-radius: 6px; text-decoration: none; font-size: 16px; }
    .primary { background: var(--brass-400); color: var(--on-brass); font-weight: 500; }
    .secondary { border: 1px solid var(--brass-line); color: var(--ivory-200); }
    .btn:focus-visible, .mark:focus-visible { outline: 3px solid var(--brass-400); outline-offset: 3px; }
    @media (max-width: 480px) { h1 { font-size: 44px; } }
  </style>
</head>
<body>
  <main>
    <a class="mark" href="/">Mills On Mission</a>
    <h1 id="heading">This page isn’t here</h1>
    <p id="message">The link may be old or mistyped. Here’s where you can go instead.</p>
    <div class="actions">
      <a class="btn primary" id="primary" href="/">Go to the home page</a>
      <a class="btn secondary" id="secondary" href="/pray/">Pray for Sean</a>
    </div>
  </main>
  <script>
    // A prayer card link (/card/...) that isn't live yet: point people to the prayer page instead.
    (function () {
      if (!/^\/card(\/|$)/i.test(location.pathname)) return;
      document.getElementById('heading').textContent = 'The card view is almost ready';
      document.getElementById('message').textContent = 'Thanks for tapping my prayer card. While the moving portrait is being finished, you can still see my prayer requests and pray with me.';
      var p = document.getElementById('primary');
      p.href = '/pray/?src=card';
      p.textContent = 'Pray for Sean';
      var s = document.getElementById('secondary');
      s.href = '/';
      s.textContent = 'Go to the home page';
    })();
  </script>
</body>
</html>
